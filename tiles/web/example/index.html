<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>slup-geo · пример</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../tiles/vendor/maplibre-gl.css" />
  <script src="../tiles/vendor/pmtiles.js"></script>
  <style>
    :root {
      --text: #111827;
      --muted: #6b7280;
      --border: rgba(17, 24, 39, .12);
      --border-strong: rgba(17, 24, 39, .2);
      --bg: #ffffff;
      --bg-soft: #f3f4f6;
      --bg-hover: rgba(37, 99, 235, .07);
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --ok: #16a34a;
      --err: #dc2626;
      --shadow: 0 14px 40px rgba(15, 23, 42, .16);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--text); }
    #map { position: absolute; inset: 0; background: #eef1f4; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(17, 24, 39, .16); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(17, 24, 39, .28); }
    * { scrollbar-width: thin; scrollbar-color: rgba(17, 24, 39, .22) transparent; }

    .panel {
      position: absolute; z-index: 1000; top: 14px; left: 14px; width: 400px;
      max-width: calc(100vw - 28px); max-height: calc(100vh - 28px); overflow-y: auto;
      background: var(--bg); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: var(--shadow); padding: 14px;
    }
    .panel header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .panel h1 { font-size: 13px; font-weight: 700; letter-spacing: .2px; margin: 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; flex: 0 0 auto; }
    .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(22, 163, 74, .16); }
    .dot.err { background: var(--err); box-shadow: 0 0 0 3px rgba(220, 38, 38, .16); }

    .search { position: relative; }
    .search input {
      width: 100%; height: 42px; padding: 0 34px 0 36px; border-radius: 11px;
      border: 1px solid var(--border-strong); background: #fff; color: var(--text);
      font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .search input::placeholder { color: #9ca3af; }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .14); }
    .search .icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: #9ca3af; pointer-events: none;
    }
    .search .clear {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 26px; height: 26px; border: 0; border-radius: 8px; background: transparent;
      color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer;
    }
    .search .clear:hover { background: var(--bg-soft); color: var(--text); }

    #suggest {
      display: none; position: fixed; z-index: 2000; max-height: 46vh; overflow-y: auto;
      padding: 5px; background: var(--bg); border: 1px solid var(--border-strong);
      border-radius: 12px; box-shadow: var(--shadow);
    }
    #suggest.open { display: block; }

    ul.list { list-style: none; margin: 0; padding: 0; }
    li.item {
      padding: 9px 10px; border-radius: 10px; cursor: pointer; border: 1px solid transparent;
      transition: background .12s, border-color .12s;
    }
    li.item:hover { background: var(--bg-hover); border-color: rgba(37, 99, 235, .22); }
    .rname {
      font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .rmeta { margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .chip {
      font-size: 10px; line-height: 16px; padding: 0 7px; border-radius: 6px;
      border: 1px solid var(--border); color: var(--muted); background: #fff; white-space: nowrap;
    }
    .chip.house { color: #15803d; border-color: #bbf7d0; background: #f0fdf4; }
    .chip.area { color: #1d4ed8; border-color: #bfdbfe; background: #eff6ff; }
    .chip.picked { display: none; color: #fff; border-color: var(--accent); background: var(--accent); }
    .rtype { color: var(--muted); font-size: 11px; }
    li.muted-row { cursor: default; color: var(--muted); font-size: 12px; padding: 7px 10px; }
    li.muted-row:hover { background: none; border-color: transparent; }

    #selection { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .sel { background: var(--accent-soft); border: 1px solid #bfdbfe; border-radius: 12px; padding: 10px 12px; }
    .sel-name { font-size: 14px; font-weight: 600; line-height: 1.4; }
    .sel-meta { margin-top: 4px; color: var(--muted); font-size: 11px; font-family: Consolas, monospace; }
    .section-title {
      margin: 12px 0 2px; color: var(--muted); font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px;
    }
    #zones { max-height: 36vh; overflow-y: auto; }
    #zones li.item { padding: 8px 10px; }
    #zones li.picked { background: var(--accent-soft); border-color: #bfdbfe; }
    #zones li.picked .chip.picked { display: inline-block; }

    .hint { margin-top: 12px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .stat { margin-top: 8px; color: var(--muted); font-size: 11px; font-family: Consolas, monospace; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="panel" class="panel">
    <header>
      <span class="dot" id="status-dot"></span>
      <h1>slup-geo · пример</h1>
    </header>

    <div class="search">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="q" type="text" placeholder="Адрес, улица, город, район…" autocomplete="off" />
      <button id="clear" class="clear" title="Сбросить" hidden>×</button>
    </div>

    <section id="selection" hidden>
      <div class="sel">
        <div class="sel-name" id="sel-name"></div>
        <div class="sel-meta" id="sel-meta"></div>
      </div>
      <div class="section-title">Входит в (по возрастанию)</div>
      <ul id="zones" class="list"></ul>
    </section>

    <div class="hint" id="hint">Кликните по карте или найдите адрес — выберем дом или ближайшую зону.</div>
    <div class="stat" id="stat"></div>
  </div>

  <ul id="suggest" class="list"></ul>

  <script type="module" src="./app.js"></script>
</body>
</html>
