name: build

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions закреплены по commit SHA (обновляет Dependabot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Проверка SQL-схемы и PGStore на живом PostGIS: расширения → фикстура → представления → use case'ы.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go test (integration)
        run: go test -tags=integration ./internal/geo/...
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/geo_test?sslmode=disable

  # Автотег на push в master: patch-бамп от последнего тега v*. Повторный запуск
  # на том же коммите переиспользует уже созданный тег (идемпотентность).
  tag:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          set -euo pipefail

          existing="$(git tag --points-at HEAD -l 'v*' --sort=-v:refname | head -n1)"
          if [ -n "$existing" ]; then
            echo "version=$existing" >> "$GITHUB_OUTPUT"
            echo "Тег уже существует на этом коммите: $existing"
            exit 0
          fi

          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            base="${latest#v}"
            base="${base%%-*}"
            base="${base%%+*}"
            IFS='.' read -r major minor patch <<< "$base"
            next="v${major}.${minor}.$((patch + 1))"
          fi

          git tag "$next"
          git push origin "$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Создан тег: $next"

  # Публикация в Docker Hub: <DOCKERHUB_USERNAME>/slup-geo:<версия> и :latest.
  # Платформы: linux/amd64 и linux/arm64 (arm64 собирается через QEMU — долго).
  # Секреты репозитория: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Read & Write).
  publish:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [test, integration, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build_date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: true
          build-args: |
            VERSION=${{ needs.tag.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build_date.outputs.value }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/slup-geo:${{ needs.tag.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/slup-geo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
