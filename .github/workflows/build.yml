name: build

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # Автотег на push в master: patch-бамп от последнего тега v*. Повторный запуск
  # на том же коммите переиспользует уже созданный тег (идемпотентность).
  tag:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          set -euo pipefail

          existing="$(git tag --points-at HEAD -l 'v*' --sort=-v:refname | head -n1)"
          if [ -n "$existing" ]; then
            echo "version=$existing" >> "$GITHUB_OUTPUT"
            echo "Тег уже существует на этом коммите: $existing"
            exit 0
          fi

          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            base="${latest#v}"
            base="${base%%-*}"
            base="${base%%+*}"
            IFS='.' read -r major minor patch <<< "$base"
            next="v${major}.${minor}.$((patch + 1))"
          fi

          git tag "$next"
          git push origin "$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Создан тег: $next"

  # Публикация в Docker Hub: <DOCKERHUB_USERNAME>/slup-geo:<версия> и :latest.
  # Секреты репозитория: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Read & Write).
  publish:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [test, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ needs.tag.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/slup-geo:${{ needs.tag.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/slup-geo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
